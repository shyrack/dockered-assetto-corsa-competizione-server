services:
  acc:
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: acc-server
    container_name: acc-server
    restart: unless-stopped
    ports:
      - "9600:9600/tcp"
      - "9600:9600/udp"
      - "9601:9601/tcp"
      - "9601:9601/udp"
    volumes:
      - ./acc-server/accServer.exe:/app/server/accServer.exe:ro
      - ./cfg:/app/server/cfg
      - ./results:/app/server/results
      - ./log:/app/server/log
      - compatdata:/app/compatdata

volumes:
  compatdata:
